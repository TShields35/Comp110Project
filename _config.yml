title: Does Programming Practice Prepares Students for Quizzes
email: tbshield@unc.edu
description: >- # this means to ignore newlines until "baseurl:"
  In this website, we will analyze the data from Dr. Izzy Hinks class and determine if students believe 
  programming questions provide useful preparation for quizzes. We will then compare these with the responses from students
  regarding ls questions to determine if one preparation is more effective than the other. Finally, we will compare both results with quiz preparedness to determine if one preparation is more effective than the other.
baseurl: "Comp110Project" # the subpath of your site, e.g. /blog
url: "github.com/TShields35" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: jekyllrb
github_username:  jekyll

